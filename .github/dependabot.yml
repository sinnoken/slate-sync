# Monthly update PRs for the GitHub Actions used by the workflows and for the Python requirements.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:                 # one PR for all action updates
        patterns: ['*']
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly
    # requirements.txt states a minimum supported version, not a pin: only raise it when the current range
    # excludes a new release, never just to follow the latest version.
    versioning-strategy: increase-if-necessary
