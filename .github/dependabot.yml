# Monthly update PRs for the GitHub Actions used by the workflows and for the npm build tools.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:                 # one PR for all action updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:                     # one PR for all npm updates
        patterns: ['*']
