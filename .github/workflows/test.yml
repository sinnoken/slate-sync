# Build the web pages once, run the regression tests and, on main, publish that same build to GitHub Pages. Runs on
# every push to main and on pull requests (documentation-only changes are skipped), and on demand. A push whose
# commit was already pushed and tested successfully, or is being tested, is skipped; a run for a pull request does
# not count, because only a push run deploys.
name: Test
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dedupe:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" \
                  --json databaseId,event,status,conclusion \
                  --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.event == \"push\") | select(.status != \"completed\" or .conclusion == \"success\")] | length")
            [ "$n" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  test:
    needs: dedupe
    if: needs.dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install npm packages and build the web pages
        run: npm ci && npm run build
      # ffmpeg is used by the command-line analyzer and by the tests that read audio through it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Web pages and analysis core (npm run check)
        run: npm run check
      - name: Slate, generator and command-line tests (node --test)
        run: node --test tests/*.test.mjs tests/web/checks.test.mjs
      # Headless Chrome (preinstalled on the ubuntu runner) runs the built dist/sync-analyzer.html on tests/fixtures/ and the
      # results are compared with the truth, the Node command line and the text-report snapshot. The fixtures avoid HEVC, which
      # Linux Chrome cannot decode with WebCodecs. cam.mp4's creation time was written for UTC+8, so the browser runs in it.
      - name: Web analyzer in headless Chrome (truth, command line, report snapshot)
        timeout-minutes: 5
        env:
          TZ: Asia/Taipei
        run: node --test tests/web/analyzer.test.mjs
      # The pages are built once, above; the deploy job publishes this same dist/ only after every test passed.
      - name: Keep the tested pages for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  # Publish to GitHub Pages (one-time setup: Settings → Pages → Source: "GitHub Actions"). Documentation-only pushes
  # skip the tests and therefore the deployment; the pages do not include docs/.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
