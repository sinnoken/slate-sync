# Run the regression tests on every push to main and on pull requests (documentation-only changes are skipped),
# and on demand. A push whose commit was already tested successfully, or is being tested, is skipped.
name: Test
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dedupe:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" \
                  --json databaseId,status,conclusion \
                  --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status != \"completed\" or .conclusion == \"success\")] | length")
            [ "$n" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  test:
    needs: dedupe
    if: needs.dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install npm packages and build the web pages
        run: npm ci && npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r python/requirements.txt pupil-apriltags pyflakes
      - name: Static check
        run: python -m pyflakes python/slate_sync.py tests/*.py tests/web/*.py tests/fixtures/*.py
      - name: Web pages (syntax, four-language strings)
        run: node tests/check_web.js
      - name: Analysis core runs in node without browser APIs
        run: node tests/check_core.js
      - name: Visual code tables
        run: python tests/check_visual_code.py
      - name: Waveform pitch matches the slate
        run: python tests/check_wave_pitch.py
      - name: LTC bits match the slate
        run: python tests/check_ltc_bits.py
      - name: Audio reads land on the exact sample
        run: python tests/check_read_audio.py
      - name: Report prints on a non-UTF-8 console
        run: python tests/check_cli_encoding.py
      - name: Start clock never shows 60 seconds
        run: python tests/check_clock_format.py
      # Headless Chrome (preinstalled on the ubuntu runner) runs the built dist/sync-analyzer.html on tests/fixtures/ and the
      # results are compared with the truth, the CLI and the text-report snapshot. The fixtures avoid HEVC, which
      # Linux Chrome cannot decode with WebCodecs.
      - name: Web analyzer in headless Chrome (truth, CLI, report snapshot)
        timeout-minutes: 5
        run: python tests/web/check_analyzer.py
